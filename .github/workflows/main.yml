---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: |
          brew install tree-sitter-cli
      - uses: actions/checkout@v4
      - name: Test
        run: |
          tree-sitter generate
          tree-sitter test
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update generated artifacts'
          file_pattern: src
          add_options: -f
          status_options: --ignored
          push_options: -f
          skip_checkout: true
          branch: main

  luarocks:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          brew install tree-sitter-cli
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install tree-sitter-cli
      - uses: actions/checkout@v4
      - name: Generate extra.rockspec
        run: |
          perl -00ne 'print if $. == 2' ./*-scm-1.rockspec > extra.rockspec
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          lux_version: latest
      - name: Pack
        run: |
          lx --lua-version=5.1 pack
      - uses: actions/upload-artifact@v7
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          name: artifact-${{ matrix.runs-on }}
          path: |
            *.rock
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

  npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    uses: Freed-Wu/workflows/.github/workflows/package-npm.yml@master
    with:
      init: true
      generate: true
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}

  crates:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    uses: Freed-Wu/workflows/.github/workflows/package-crates.yml@master
    with:
      init: true
      generate: true
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_TOKEN}}

  pypi:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    uses: Freed-Wu/workflows/.github/workflows/package-pypi.yml@master
    with:
      init: true
      generate: true
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}

  deploy-aur:
    needs: pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: Freed-Wu/update-aur-package@v1.0.11
        if: startsWith(github.ref, 'refs/tags/')
        with:
          package_name: python-tree-sitter-tmux
          ssh_private_key: ${{secrets.AUR_SSH_PRIVATE_KEY}}

  deploy-nur:
    needs: pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger Workflow
        run: >
          curl -X POST -d '{"ref":"main"}'
          -H "Accept: application/vnd.github.v3+json"
          -H "Authorization: Bearer ${{secrets.GH_TOKEN}}"
          https://api.github.com/repos/Freed-Wu/nur-packages/actions/workflows/version.yml/dispatches
