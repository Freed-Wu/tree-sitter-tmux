---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          npm install -g tree-sitter-cli
          tree-sitter generate
      - name: Test
        run: |
          tree-sitter test
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: main
        run: |
          rm -rf main/src
          cp -r src main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: main
          branch: main
          commit_message: 'chore: update generated artifacts'
          file_pattern: src
          add_options: -f

  npm:
    needs: test
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main

  crates:
    needs: test
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main

  pypi:
    needs: test
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main

  deploy-aur:
    needs: pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: Freed-Wu/update-aur-package@v1.0.11
        if: startsWith(github.ref, 'refs/tags/')
        with:
          package_name: python-tree-sitter-tmux
          ssh_private_key: ${{secrets.AUR_SSH_PRIVATE_KEY}}

  deploy-nur:
    needs: pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger Workflow
        run: >
          curl -X POST -d '{"ref":"main"}'
          -H "Accept: application/vnd.github.v3+json"
          -H "Authorization: Bearer ${{secrets.GH_TOKEN}}"
          https://api.github.com/repos/Freed-Wu/nur-packages/actions/workflows/version.yml/dispatches
